services:
  web:
    build: .
    image: creatoros
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_PATH: /data/creatoros.db
    volumes:
      - creatoros-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  creatoros-data: