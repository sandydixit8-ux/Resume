# ResumeIQ AI — production Docker deployment (backend + frontend + Caddy HTTPS)
#
# Usage (from this repo root):
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Notes:
#   - Secrets live in ../backend/.env (see deploy/.env.production.example).
#   - The two data paths are OVERRIDDEN here to the named volume, so the same
#     .env also works for the systemd setup (which uses /var/www/... paths).
#   - Replace yourdomain.com in deploy/Caddyfile with your real domain.

services:
  # ---------------- Backend (FastAPI) ----------------
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: resumeiq-backend:latest
    env_file:
      - ../backend/.env
    environment:
      # Override data paths -> named volume (compose `environment` wins over env_file)
      - DATABASE_URL=sqlite:////data/dpiic.db
      - UPLOAD_DIR=/data/uploads
    volumes:
      - resumeiq_data:/data
    restart: unless-stopped

  # ---------------- Frontend (Next.js) ----------------
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    image: resumeiq-frontend:latest
    environment:
      # Reach the backend over the compose network
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ---------------- Caddy (HTTPS reverse proxy) ----------------
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - UPSTREAM_FRONTEND=frontend:3000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  resumeiq_data:
  caddy_data:
  caddy_config:
