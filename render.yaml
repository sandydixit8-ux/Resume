services:
  - type: web
    name: creatoros
    runtime: docker
    plan: 1c-2g
    region: oregon
    dockerContext: ./creatoros
    dockerfilePath: ./creatoros/Dockerfile
    dockerCommand: ./docker-entrypoint.sh
    healthCheckPath: /api/health
    autoDeployTrigger: 'commit'
    envVars:
      - key: AUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        value: https://creatoros.onrender.com
      - key: DATABASE_PATH
        value: /data/creatoros.db
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
    disk:
      name: creatoros-data
      mountPath: /data
      sizeGB: 1